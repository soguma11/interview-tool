<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBI Feedback Tool Pro</title>
    <script type="module" crossorigin src="/assets/index-B1bG087U.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bh8Lb5WX.css">
    <style>
        body { background-color: #f8fafc; }
        #custom-ui-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            font-family: 'Inter', -apple-system, sans-serif;
            display: none;
        }
        .section-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
            margin: 35px 0 15px 0;
            display: flex;
            align-items: center;
        }
        .section-header::before {
            content: "";
            width: 4px;
            height: 20px;
            background: #6366f1;
            margin-right: 12px;
            border-radius: 2px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: #475569; 
            font-size: 0.85rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background-color: #f1f5f9;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-group textarea:focus {
            background-color: #fff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .submit-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 40px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            transition: transform 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); opacity: 0.95; }
        .hint { font-size: 0.75rem; color: #94a3b8; font-weight: normal; margin-left: 5px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <div id="custom-ui-container">
        <h1 style="text-align: center; margin-bottom: 40px; color: #0f172a; font-weight: 800; letter-spacing: -0.025em;">SBI Feedback System</h1>

        <div class="section-header">基本情報</div>
        <div class="grid-2">
            <div class="form-group">
                <label>被評価者名</label>
                <input type="text" id="subjectName" placeholder="氏名を入力">
            </div>
            <div class="form-group">
                <label>評価者名</label>
                <input type="text" id="evaluatorName" placeholder="氏名を入力">
            </div>
        </div>

        <div class="section-header">Step 1: 事前準備</div>
        <div class="form-group">
            <label>面談の目的・ゴール設定</label>
            <textarea id="preGoal" placeholder="どのような状態を目指しますか？"></textarea>
        </div>
        <div class="form-group">
            <label>配慮・留意点</label>
            <textarea id="preNote" placeholder="性格や背景など、伝える際の注意点"></textarea>
        </div>

        <div class="section-header">Step 2: 対話・情報収集</div>
        <div class="grid-2">
            <div class="form-group">
                <label>本人の振り返り</label>
                <textarea id="selfReview" style="height: 120px;" placeholder="本人の言い分・自己評価"></textarea>
            </div>
            <div class="form-group">
                <label>評価者の観察メモ</label>
                <textarea id="observerMemo" style="height: 120px;" placeholder="事実・数値・周囲の声"></textarea>
            </div>
        </div>

        <div class="section-header">Step 3: SBI & コンピテンシー</div>
        <div class="form-group">
            <label>発揮能力カテゴリー</label>
            <select id="competency-select">
                <optgroup label="マネジメント力">
                    <option value="マネジメント力:リーダーシップ">リーダーシップ</option>
                    <option value="マネジメント力:育成力">育成力</option>
                    <option value="マネジメント力:チームワーク">チームワーク</option>
                </optgroup>
                <optgroup label="知的属性">
                    <option value="知的属性:分析的思考力">分析的思考力</option>
                    <option value="知的属性:概念的思考力">概念的思考力</option>
                </optgroup>
                <optgroup label="対人関係性">
                    <option value="対人関係性:対人影響力">対人影響力</option>
                    <option value="対人関係性:対人理解力">対人理解力</option>
                </optgroup>
                <optgroup label="自己内面属性">
                    <option value="自己内面属性:イニシアティブ">イニシアティブ</option>
                    <option value="自己内面属性:柔軟性">柔軟性</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label>S: 状況 <span class="hint">Situation</span></label>
            <textarea id="situation"></textarea>
        </div>
        <div class="form-group">
            <label>B: 行動 <span class="hint">Behavior</span></label>
            <textarea id="behavior"></textarea>
        </div>
        <div class="form-group">
            <label>I: 影響 <span class="hint">Impact</span></label>
            <textarea id="impact"></textarea>
        </div>

        <button class="submit-btn" id="saveBtn">Googleドライブにドキュメントを保存</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw-HCLiI7UB7BrpuULPir0Rg73z2rat9Y6rjPoomOJcPPi-wksCp9wwlBEq13yKVjcpHw/exec";

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('custom-ui-container').style.display = 'block';
            }, 1000);
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveBtn');
            const data = {
                subjectName: document.getElementById('subjectName').value,
                evaluatorName: document.getElementById('evaluatorName').value,
                preGoal: document.getElementById('preGoal').value,
                preNote: document.getElementById('preNote').value,
                selfReview: document.getElementById('selfReview').value,
                observerMemo: document.getElementById('observerMemo').value,
                competency: document.getElementById('competency-select').value,
                situation: document.getElementById('situation').value,
                behavior: document.getElementById('behavior').value,
                impact: document.getElementById('impact').value
            };

            btn.textContent = "保存中...";
            btn.disabled = true;

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify(data)
                });
                alert("ドキュメントを保存しました！");
            } catch (e) {
                alert("保存に失敗しました。");
            } finally {
                btn.textContent = "Googleドライブにドキュメントを保存";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
