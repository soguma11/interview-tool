<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBIフィードバック作成ツール</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; text-align: center; color: #2c3e50; }
        .section { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        textarea { height: 80px; resize: vertical; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { background-color: #3498db; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SBIフィードバック作成</h1>
        
        <div class="section grid">
            <div>
                <label>被評価者名</label>
                <input type="text" id="subjectName" placeholder="例：田中 太郎">
            </div>
            <div>
                <label>評価者名</label>
                <input type="text" id="evaluatorName" placeholder="例：佐藤 次郎">
            </div>
        </div>

        <div class="section">
            <label>本人の振り返り（本人談）</label>
            <textarea id="selfReview" placeholder="本人はどのように振り返っていますか？"></textarea>
        </div>
        <div class="section">
            <label>評価者の観察メモ（事実）</label>
            <textarea id="observerMemo" placeholder="周囲への影響や具体的な行動の事実は？"></textarea>
        </div>

        <div class="section">
            <label>発揮能力（コンピテンシー）</label>
            <select id="competency-select">
                <optgroup label="マネジメント力">
                    <option value="マネジメント力:リーダーシップ">リーダーシップ</option>
                    <option value="マネジメント力:育成力">育成力</option>
                    <option value="マネジメント力:チームワーク">チームワーク</option>
                </optgroup>
                <optgroup label="知的属性">
                    <option value="知的属性:分析的思考力">分析的思考力</option>
                    <option value="知的属性:概念的思考力">概念的思考力</option>
                </optgroup>
                <optgroup label="対人関係性">
                    <option value="対人関係性:対人影響力">対人影響力</option>
                    <option value="対人関係性:対人理解力">対人理解力</option>
                </optgroup>
                <optgroup label="自己内面属性">
                    <option value="自己内面属性:イニシアティブ">イニシアティブ</option>
                    <option value="自己内面属性:柔軟性">柔軟性</option>
                </optgroup>
            </select>
        </div>

        <div class="section">
            <label>【S】状況 (Situation)</label>
            <textarea id="situation" placeholder="いつ、どこで、どんな場面でしたか？"></textarea>
        </div>
        <div class="section">
            <label>【B】行動 (Behavior)</label>
            <textarea id="behavior" placeholder="具体的にどんな行動をとりましたか？"></textarea>
        </div>
        <div class="section">
            <label>【I】影響 (Impact)</label>
            <textarea id="impact" placeholder="その結果、どのような影響がありましたか？"></textarea>
        </div>

        <button class="btn" id="saveBtn">Googleドライブに保存</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyE64Qb55wzm5joycCY6JkU_VvPFCZZ-xllEePJ0q-pYL2cW8SNx8Voy6nHtZ1kaT41cw/exec"; // ★ここに最新のURLを貼ってください

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveBtn');
            const data = {
                subjectName: document.getElementById('subjectName').value,
                evaluatorName: document.getElementById('evaluatorName').value,
                selfReview: document.getElementById('selfReview').value,
                observerMemo: document.getElementById('observerMemo').value,
                competency: document.getElementById('competency-select').value,
                situation: document.getElementById('situation').value,
                behavior: document.getElementById('behavior').value,
                impact: document.getElementById('impact').value
            };

            btn.textContent = "保存中...";
            btn.disabled = true;

            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify(data)
                });
                alert("ドキュメントを保存しました！");
            } catch (e) {
                alert("エラーが発生しました。");
            } finally {
                btn.textContent = "Googleドライブに保存";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
