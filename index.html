<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>interview-tool</title>
    <script type="module" crossorigin src="/assets/index-B1bG087U.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bh8Lb5WX.css">
    <title>面接練習ツール（あなたのツール名）</title>
<meta name="description" content="面接の振り返りを効率化するツールです。">
<meta property="og:title" content="面接練習ツール">
<meta property="og:description" content="現場で使えるSBIモデルに基づいた振り返りツール。">
<meta property="og:type" content="website">
  </head>
  <body>
    <div id="root"></div>
    <script>
// 【ここ！！】コピーした /exec で終わるURLをここに貼り付けてください
  const GAS_URL = "https://script.google.com/macros/s/AKfycby-D-mB6SvYp1g11nKV1hbDtj2mSAkzrcpnYNNiUoTe1-XHxQ7yop9yrfvuP_3Js_hZYg/exec"; 

  window.addEventListener('load', () => {
      // 「フィードバック出力」ボタンを探す（緑色のボタンを想定）
      // あなたのツールのボタン構成に合わせて調整が必要な場合があります
      const buttons = document.querySelectorAll('button');
      const targetBtn = Array.from(buttons).find(b => b.textContent.includes('フィードバック出力'));

      if (targetBtn) {
        // 元のボタンの動き（ダウンロードなど）を止めて、GASに送るようにする
        targetBtn.onclick = async (e) => {
          e.preventDefault();
          e.stopPropagation();

          // 入力欄から値を取得する
          // ツール上のプレースホルダー名などから推測して取得
          const data = {
            subjectName: document.querySelector('input[placeholder*="被評価者"]')?.value || "未入力",
            evaluatorName: document.querySelector('input[placeholder*="評価者"]')?.value || "未入力",
            situation: document.querySelectorAll('textarea')[0]?.value || "未入力",
            behavior: document.querySelectorAll('textarea')[1]?.value || "未入力",
            impact: document.querySelectorAll('textarea')[2]?.value || "未入力"
          };

          targetBtn.textContent = "保存中...";
          targetBtn.disabled = true;

          // --- 修正後のイメージ ---

try {
  // ここは GAS_URL という名前だけにする（URLを直接書かない）
  await fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(data)
  });
  alert("Googleドライブに保存しました！");
} catch (err) {
// ...
            alert("エラーが発生しました。");
          } finally {
            targetBtn.textContent = "フィードバック出力";
            targetBtn.disabled = false;
          }
        };
      }
    });
  </script>
  </body>
</html>
