<!doctype html>
<html lang="ja">

        #custom-ui-container {

            padding: 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);

        }
        .submit-btn {

            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;

            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .section-title {

            </div>
        </div>

        <div class="form-group">
            <label>面談の目的・留意点</label>
            <textarea id="preNote" placeholder="ゴールや配慮すべきこと"></textarea>
        </div>
        <div class="form-group">
            <label>本人の振り返り / 評価者メモ</label>
            <textarea id="combinedMemo" style="height: 150px;" placeholder="対話の中で出た重要な事実をメモ..."></textarea>
        </div>

        <div class="section-title">SBIフィードバック作成</div>
        <div class="form-group">

                <optgroup label="対人関係性">

                </optgroup>
                <optgroup label="自己内面属性">
                    <option value="自己内面属性:イニシアティブ">イニシアティブ</option>
                    <option value="自己内面属性:柔軟性">柔軟性</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label>S: 状況</label>
            <textarea id="situation"></textarea>
        </div>
        <div class="form-group">
            <label>B: 行動</label>
            <textarea id="behavior"></textarea>
        </div>
        <div class="form-group">
            <label>I: 影響</label>
            <textarea id="impact"></textarea>
        </div>

        <button class="submit-btn" id="saveBtn">Googleドライブに保存</button>
    </div>
